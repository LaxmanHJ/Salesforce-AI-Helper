<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    h2 {
      color: #0070d2;
      margin-top: 0;
    }

    .option {
      margin: 15px 0;
      padding: 10px;
      background: #f3f3f3;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .option:hover {
      background: #e0e0e0;
    }

    .footer {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>


  <!-- Modal Template (used by content.js) -->
  <template id="sf-helper-modal-template">

    <div class="sf-helper-modal-content">

      <span class="sf-helper-close">&times;</span>
      <h2>Salesforce Quick Helper</h2>
      <div class="sf-helper-info">
        <!-- <h2>🚀 Salesforce Helper</h2>
        <div class="option" id="openCurrent">
          📋 Show Page Info
        </div>
        <div class="option" id="openSetup">
          ⚙️ Open Setup
        </div>
        <div class="option" id="openDevConsole">
          💻 Open Dev Console
        </div>
        <div class="footer">
          Version 1.0.0<br>
          Customize this extension for your needs!
        </div> -->
        <p><strong>Current URL:</strong><br><span id="modal-url" data-placeholder="url">Loading...</span></p>
        <p id="modal-record-id-container" style="display:none;"><strong>Record ID:</strong><br><span
            id="modal-record-id" data-placeholder="recordId">-</span></p>
        <p id="modal-org-id-container" style="display:none;"><strong>Org ID:</strong><br><span id="modal-org-id"
            data-placeholder="orgId">-</span></p>
        <p><strong>User:</strong><br><span id="modal-user" data-placeholder="userName">Current User</span></p>
        <hr>
        <p><em>This is a starter template.</em></p>
      </div>
      <div class="sf-helper-actions">
        <button id="copy-record-id">Copy Record ID</button>
        <button id="open-setup">Open Setup</button>
  <button id="openDevConsole">Open Dev Console</button>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>

</html>
